name: car_rental_mobile
description: "Car Rental mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9

  provider: ^6.1.5+1

  share_plus: ^13.3.0

  firebase_core: ^4.4.0
  firebase_messaging: ^16.4.3
  image_picker: ^1.2.3

  google_fonts: ^6.3.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/royaldrive.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/royaldrive.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/royaldrive.png"